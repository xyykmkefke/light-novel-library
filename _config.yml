# GitHub Pages（legacy 分支构建）使用 Jekyll。
# 只发布运行时文件；构建脚本、报告、截图、文档与构建输入一律不进入站点。
# 运行时白名单：index.html、manifest.webmanifest、sw.js、icon.svg、icons/、
# data/light-novels-{lite,rest,extra,volumes,rn}.js
exclude:
  - node_modules
  - scripts
  - reports
  - screenshots
  - data/build
  - data/light-novels.js
  - data/bgm-detail-fills.json
  - data/manual-relations.json
  - data/ranobedb-cn.json
  - data/ranobedb-cn-blocklist.json
  - data/ranobedb-volume-fixes.json
  - data/ranobedb-counts.json
  - data/volume-fills.json
  - data/cn-fills.json
  - .github
  - .automation
  - package.json
  - package-lock.json
  - README.md
  - HANDOVER.md
  - LICENSE
