name: data-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 数据校验
        run: npm run check-data
      - name: 合并逻辑测试
        run: npm run test-merge
      - name: 部署边界校验
        run: npm run check-deploy
      - name: 安装 Chromium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
        id: setup-chrome
      - name: 浏览器端自动化验收
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node scripts/verify.mjs
      - name: 分片失败三态回归
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node scripts/check-shard-failure.mjs
      - name: 搜索覆盖率全量审计
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node scripts/audit-search-coverage.mjs
      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots
          path: screenshots
          if-no-files-found: ignore
